name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # Real search engine for src/search/typesense.integration.test.ts
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: test-key
        ports: ['8108:8108']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TYPESENSE_TEST_URL: http://localhost:8108
          TYPESENSE_TEST_API_KEY: test-key
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  lighthouse:
    name: Lighthouse (performance budget)
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: newsmedia
          POSTGRES_USER: newsmedia
          POSTGRES_PASSWORD: newsmedia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U newsmedia" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://newsmedia:newsmedia@localhost:5432/newsmedia
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database with sample content
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Build the standalone web app
        run: |
          pnpm --filter @nm/web build
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          PORT: 3000

  docker:
    name: Docker build (${{ matrix.service }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
