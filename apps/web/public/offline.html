<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Офлайн · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #15171a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans',
          sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1115;
          color: #eceae6;
        }
      }
      h1 {
        font-family: Georgia, 'Noto Serif', serif;
        font-size: 1.8rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        max-width: 36ch;
        margin: 0.5rem auto;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.7rem 1.3rem;
        border-radius: 999px;
        background: #13233a;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>Няма връзка с интернет</h1>
      <p>Запазените статии, които сте отваряли, остават достъпни офлайн.</p>
      <p lang="en">
        <strong>You are offline.</strong> Saved articles you have opened before are still available.
      </p>
      <a href="/bg/saved">Запазени · Saved</a>
    </main>
  </body>
</html>
